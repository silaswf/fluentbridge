# @file .github/workflows/build-android-apk.yml
# Pipeline CI/CD GitHub Actions: varredura de segredos (secret-scan), testes, build multiplataforma (Windows .exe + Android .apk/.aab) e publicação em Releases.
name: Build Multiplatform Release (Android & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan tracked files for leaked API keys or secrets (S-04)
        run: |
          node -e "
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const files = cp.execSync('git ls-files').toString().trim().split('\n').filter(Boolean);
            const patterns = [
              /AQ\.Ab8[A-Za-z0-9_-]{20,}/,
              /AIza[0-9A-Za-z_-]{30,}/,
              /ghp_[A-Za-z0-9]{30,}/,
              /github_pat_[A-Za-z0-9_]{30,}/,
              /sk-[A-Za-z0-9]{32,}/,
              /cfut_[A-Za-z0-9]{20,}/
            ];
            let found = 0;
            for (const f of files) {
              if (!fs.existsSync(f) || fs.statSync(f).isDirectory()) continue;
              const txt = fs.readFileSync(f, 'utf8');
              for (const re of patterns) {
                if (re.test(txt)) {
                  console.error('SECRET LEAK DETECTED in', f, 'matching', re);
                  found++;
                }
              }
            }
            if (found > 0) process.exit(1);
            console.log('Secret scan clean across', files.length, 'tracked files.');
          "

  build-apk:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies, test & build web bundle
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Android Release Keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n[:space:]' | base64 -d > "${{ github.workspace }}/android/app/fluentbridge-release.jks"
          ls -la "${{ github.workspace }}/android/app/fluentbridge-release.jks"

      - name: Compute version metadata
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_LABEL="${GITHUB_REF_NAME}"
          else
            VERSION_LABEL="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          VERSION_NAME="${VERSION_LABEL#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "VERSION_LABEL=${VERSION_LABEL}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Build Signed Release APK & Play Store AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/fluentbridge-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Package signed APK and AAB files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "FluentBridge-${VERSION_LABEL}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "FluentBridge.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "FluentBridge-${VERSION_LABEL}-playstore.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "FluentBridge-playstore.aab"

      - name: Create or update private GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "FluentBridge-${VERSION_LABEL}.apk" \
              "FluentBridge.apk" \
              "FluentBridge-${VERSION_LABEL}-playstore.aab" \
              "FluentBridge-playstore.aab" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "FluentBridge-${VERSION_LABEL}.apk" \
              "FluentBridge.apk" \
              "FluentBridge-${VERSION_LABEL}-playstore.aab" \
              "FluentBridge-playstore.aab" \
              --title "FluentBridge $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Mirror APK to public silaswf/fluentbridge-releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "RELEASES_REPO_TOKEN not configured, skipping public mirror."
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" --repo silaswf/fluentbridge-releases >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "FluentBridge-${VERSION_LABEL}.apk" "FluentBridge.apk" --repo silaswf/fluentbridge-releases --clobber
          else
            gh release create "$GITHUB_REF_NAME" "FluentBridge-${VERSION_LABEL}.apk" "FluentBridge.apk" --repo silaswf/fluentbridge-releases --title "FluentBridge Academy $GITHUB_REF_NAME" --generate-notes
          fi

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & build Windows Setup .exe
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          npm ci
          npm run installer:build

      - name: Upload Windows Setup .exe to private Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem release/FluentBridge-Setup-*.exe | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $exe.FullName --clobber

      - name: Mirror Windows Setup .exe to public silaswf/fluentbridge-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Output "RELEASES_REPO_TOKEN not configured, skipping public mirror."
            exit 0
          }
          $exe = Get-ChildItem release/FluentBridge-Setup-*.exe | Select-Object -First 1
          gh release view "${{ github.ref_name }}" --repo silaswf/fluentbridge-releases *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $exe.FullName --repo silaswf/fluentbridge-releases --clobber
          } else {
            gh release create "${{ github.ref_name }}" $exe.FullName --repo silaswf/fluentbridge-releases --title "FluentBridge Academy ${{ github.ref_name }}" --generate-notes
          }
