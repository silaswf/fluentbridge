name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Android Release Keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n[:space:]' | base64 -d > "${{ github.workspace }}/android/app/fluentbridge-release.jks"
          ls -la "${{ github.workspace }}/android/app/fluentbridge-release.jks"

      - name: Compute version metadata
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_LABEL="${GITHUB_REF_NAME}"
          else
            VERSION_LABEL="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          VERSION_NAME="${VERSION_LABEL#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "VERSION_LABEL=${VERSION_LABEL}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Build Signed Release APK & Play Store AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/fluentbridge-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Package signed APK and AAB files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "FluentBridge-${VERSION_LABEL}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "FluentBridge.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "FluentBridge-${VERSION_LABEL}-playstore.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "FluentBridge-playstore.aab"

      - name: Upload FluentBridge APK & Play Store AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluentBridge-Android-Release
          path: |
            FluentBridge-${{ env.VERSION_LABEL }}.apk
            FluentBridge.apk
            FluentBridge-${{ env.VERSION_LABEL }}-playstore.aab
            FluentBridge-playstore.aab

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "FluentBridge-${VERSION_LABEL}.apk" \
              "FluentBridge.apk" \
              "FluentBridge-${VERSION_LABEL}-playstore.aab" \
              "FluentBridge-playstore.aab" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "FluentBridge-${VERSION_LABEL}.apk" \
              "FluentBridge.apk" \
              "FluentBridge-${VERSION_LABEL}-playstore.aab" \
              "FluentBridge-playstore.aab" \
              --title "FluentBridge $GITHUB_REF_NAME" \
              --generate-notes
          fi
